<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案 B 宮城平面 · 朝堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3EDE0;
  --paper: #FBF7EE;
  --ink: #232019;
  --ink-soft: #6b6255;
  --line: #C9BC9E;
  --vermilion: #B03A2E;
  --azure: #2E5E7E;
  --green: #4E7D5B;
  --gold: #B48A3C;
  --zone: #E4D9BF;
  --zone-hi: #D5C49C;
  --serif: "Noto Serif TC", "LXGW WenKai Mono TC", "PingFang TC", serif;
  --kai: "LXGW WenKai Mono TC", "Noto Serif TC", "PingFang TC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161311;
    --paper: #201C18;
    --ink: #EDE4CF;
    --ink-soft: #b5aa92;
    --line: #4f4536;
    --vermilion: #D8604F;
    --azure: #6FA3C4;
    --green: #86B894;
    --gold: #D4A95A;
    --zone: #2b251f;
    --zone-hi: #3d342a;
  }
}
:root[data-theme="dark"] {
  --bg: #161311;
  --paper: #201C18;
  --ink: #EDE4CF;
  --ink-soft: #b5aa92;
  --line: #4f4536;
  --vermilion: #D8604F;
  --azure: #6FA3C4;
  --green: #86B894;
  --gold: #D4A95A;
  --zone: #2b251f;
  --zone-hi: #3d342a;
}
* { box-sizing: border-box; }
html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--kai); min-height: 100vh; }
.wrap { max-width: 440px; margin: 0 auto; padding: 0 16px 24px; }

/* top bar: only four gauges */
.topbar {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  padding: 10px 0 8px; border-bottom: 1px solid var(--line);
}
.gauge { text-align: center; font-size: 12px; color: var(--ink-soft); }
.gauge .n { font-family: var(--serif); font-size: 15px; color: var(--ink); font-weight: 700; }
.gauge .bar { height: 4px; background: var(--zone-hi); border-radius: 2px; margin: 3px 0 2px; overflow: hidden; }
.gauge .bar i { display: block; height: 100%; background: var(--azure); }
.gauge.g2 .bar i { background: var(--green); }
.gauge.g3 .bar i { background: var(--gold); }
.gauge.g4 .bar i { background: var(--ink-soft); }

.head { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 6px; }
.head h1 { font-family: var(--serif); font-size: 20px; margin: 0; letter-spacing: .15em; }
.head .d { font-size: 13px; color: var(--ink-soft); }
.hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }

/* palace plan */
.plan {
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px; box-shadow: 0 4px 14px rgba(40,30,15,.08);
}
.plan svg { display: block; width: 100%; height: auto; }
g.zone { cursor: pointer; }
.plan rect.zone { fill: var(--zone); stroke: var(--line); stroke-width: 1.2; transition: fill .15s; }
g.zone:hover rect, g.zone:focus rect { fill: var(--zone-hi); outline: none; }
rect.zone.sel { fill: var(--zone-hi); stroke: var(--vermilion); stroke-width: 2; }
.plan rect.hall { fill: var(--zone-hi); stroke: var(--vermilion); stroke-width: 1.6; }
.plan text { font-family: var(--serif); fill: var(--ink); stroke: none; font-size: 13px; pointer-events: none; }
.plan text.sm { font-size: 11px; fill: var(--ink-soft); }
.plan .gate { fill: none; stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 3; }
.plan .compass { font-size: 11px; fill: var(--ink-soft); }

/* sheet */
.sheet {
  margin-top: 14px; background: var(--paper); border: 1px solid var(--line);
  border-radius: 8px; padding: 14px 14px 12px; border-left: 3px solid var(--azure);
}
.sheet h2 { font-family: var(--serif); font-size: 17px; margin: 0 0 4px; }
.sheet .sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
.sheet p { font-size: 15px; line-height: 1.75; margin: 0 0 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; color: var(--ink-soft); }
.tag.p { color: var(--vermilion); border-color: var(--vermilion); }
.cta {
  font: inherit; font-size: 15px; width: 100%; min-height: 44px; border-radius: 6px;
  background: var(--azure); color: #fff; border: 0; cursor: pointer;
}
.cta:disabled { opacity: .5; }
.event-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--vermilion); margin-right: 6px; vertical-align: middle; }
.legend { font-size: 12px; color: var(--ink-soft); margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" role="region" aria-label="四項指標（示意）">
    <div class="gauge g1">國庫<div class="bar"><i style="width:55%"></i></div><div class="n">中</div></div>
    <div class="gauge g2">民心<div class="bar"><i style="width:40%"></i></div><div class="n">低</div></div>
    <div class="gauge g3">軍備<div class="bar"><i style="width:70%"></i></div><div class="n">高</div></div>
    <div class="gauge g4">天命<div class="bar"><i style="width:62%"></i></div><div class="n">穩</div></div>
  </div>

  <div class="head">
    <h1>宮城</h1>
    <span class="d">景和元年 三月初六</span>
  </div>
  <p class="hint">點選宮室，前往議事或查看。紅框為主殿。</p>

  <div class="plan">
    <svg viewBox="0 0 320 380" role="group" aria-label="宮城平面圖（示意）">
      <!-- outer wall -->
      <rect x="10" y="10" width="300" height="360" rx="6" fill="none" stroke="var(--ink-soft)" stroke-width="2"/>
      <!-- gates -->
      <path class="gate" d="M140 10 L180 10"/>
      <path class="gate" d="M140 370 L180 370"/>
      <text class="compass" x="150" y="28" text-anchor="middle">午門</text>
      <text class="compass" x="150" y="364" text-anchor="middle">玄武門</text>

      <!-- 校場 west-south -->
      <g class="zone" tabindex="0" role="button" data-id="jiaochang" aria-label="校場">
        <rect x="22" y="250" width="92" height="106" rx="4" class="zone"/>
        <text x="68" y="296" text-anchor="middle">校場</text>
        <text class="sm" x="68" y="314" text-anchor="middle">軍備</text>
      </g>

      <!-- 東廠 east-south -->
      <g class="zone" tabindex="0" role="button" data-id="dongchang" aria-label="東廠">
        <rect x="206" y="250" width="92" height="106" rx="4" class="zone"/>
        <text x="252" y="296" text-anchor="middle">東廠</text>
        <text class="sm" x="252" y="314" text-anchor="middle">情報</text>
      </g>

      <!-- 太和殿 center -->
      <g class="zone" tabindex="0" role="button" data-id="taihe" aria-label="太和殿">
        <rect x="100" y="128" width="120" height="104" rx="6" class="hall"/>
        <text x="160" y="176" text-anchor="middle" style="font-size:17px;font-weight:700">太和殿</text>
        <text class="sm" x="160" y="196" text-anchor="middle">朝會・御批</text>
      </g>

      <!-- 御書房 west-north -->
      <g class="zone" tabindex="0" role="button" data-id="yushu" aria-label="御書房">
        <rect x="22" y="40" width="66" height="78" rx="4" class="zone"/>
        <text x="55" y="80" text-anchor="middle">御書房</text>
        <text class="sm" x="55" y="98" text-anchor="middle">奏章</text>
      </g>

      <!-- 慈寧宮 east-north -->
      <g class="zone" tabindex="0" role="button" data-id="cining" aria-label="慈寧宮">
        <rect x="232" y="40" width="66" height="78" rx="4" class="zone"/>
        <text x="265" y="80" text-anchor="middle">慈寧宮</text>
        <text class="sm" x="265" y="98" text-anchor="middle">太后</text>
      </g>

      <!-- 後宮 north-center -->
      <g class="zone" tabindex="0" role="button" data-id="houggong" aria-label="後宮">
        <rect x="100" y="40" width="120" height="78" rx="4" class="zone"/>
        <text x="160" y="80" text-anchor="middle">後宮</text>
        <text class="sm" x="160" y="98" text-anchor="middle">妃嬪・子嗣</text>
      </g>

      <!-- courtyard decor -->
      <rect x="100" y="244" width="120" height="0.5" fill="var(--line)"/>
      <text class="sm" x="160" y="262" text-anchor="middle">午朝廣場</text>
    </svg>
  </div>

  <section class="sheet" id="sheet" aria-live="polite">
    <h2 id="s-title">太和殿</h2>
    <p class="sub" id="s-sub">朝會・御批 · 今日 有 <span class="event-dot"></span>2 份摺本待閱</p>
    <div class="tags" id="s-tags"><span class="tag p">摺本 2</span><span class="tag">朝臣 議事</span></div>
    <p id="s-desc">百官朝會之所。今日有兩份摺本待御批，點選下方前往，將進入摺本卡片。</p>
    <button class="cta" id="go">前往議事</button>
  </section>

  <p class="legend">本頁為提案示意，宮室文字與數值皆為假資料；平面配置僅示意，不代表正式比例。</p>
</div>

<script>
(function () {
  var data = {
    taihe:    { t: '太和殿', s: '朝會・御批 · 今日 有 2 份摺本待閱', d: '百官朝會之所。今日有兩份摺本待御批，點選下方前往，將進入摺本卡片。', tags: ['摺本 2', '朝臣 議事'], cta: '前往議事' },
    yushu:    { t: '御書房', s: '奏章・私議 · 未讀 1 份', d: '皇帝獨處批閱之處，可密召一人單獨問對，所得消息不經朝議。', tags: ['密奏 1'], cta: '入御書房' },
    jiaochang:{ t: '校場', s: '軍備 · 可操練', d: '檢閱兵馬、調整營制。操練能提升軍備，但會消耗國庫。', tags: ['軍備', '需國庫'], cta: '前往校場' },
    houggong: { t: '後宮', s: '妃嬪・子嗣 · 暫無急務', d: '妃嬪往來與子嗣教養皆在此處。', tags: ['平穩'], cta: '入後宮' },
    dongchang:{ t: '東廠', s: '情報 · 有一則密報', d: '廠督呈上一則未經查證的密報，真假難辨，宜慎用。', tags: ['密報 1', '風險'], cta: '閱覽密報' },
    cining:   { t: '慈寧宮', s: '太后 · 有所請', d: '太后欲議立儲與宮中用度，請陛下擇期前往。', tags: ['家事', '天命'], cta: '前往請安' }
  };
  var sheet = {
    t: document.getElementById('s-title'),
    s: document.getElementById('s-sub'),
    d: document.getElementById('s-desc'),
    tags: document.getElementById('s-tags'),
    cta: document.getElementById('go')
  };
  var zones = document.querySelectorAll('.plan [data-id]');

  function select(id, el) {
    var v = data[id];
    if (!v) return;
    zones.forEach(function (z) { z.querySelector('rect').classList.remove('sel'); });
    el.querySelector('rect').classList.add('sel');
    sheet.t.textContent = v.t;
    sheet.s.textContent = v.s;
    sheet.d.textContent = v.d;
    sheet.cta.textContent = v.cta;
    sheet.tags.innerHTML = '';
    v.tags.forEach(function (tg, i) {
      var s = document.createElement('span');
      s.className = 'tag' + (i === 0 && /摺|密|風險/.test(tg) ? ' p' : '');
      s.textContent = tg;
      sheet.tags.appendChild(s);
    });
  }

  zones.forEach(function (z) {
    z.addEventListener('click', function () { select(z.dataset.id, z); });
    z.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(z.dataset.id, z); }
    });
  });
  select('taihe', document.querySelector('[data-id="taihe"]'));
})();
</script>
</body>
</html>
