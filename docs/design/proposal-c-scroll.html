<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案 C 史冊卷軸 · 年考</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E9DFC7;
  --paper: #F4ECD8;
  --paper-edge: #E2D3AE;
  --ink: #2A2118;
  --ink-soft: #6a5b47;
  --vermilion: #B03A2E;
  --azure: #2E5E7E;
  --green: #4E7D5B;
  --gold: #B48A3C;
  --wood: #6B4A2B;
  --line: #B8A37C;
  --serif: "Noto Serif TC", "LXGW WenKai TC", "PingFang TC", serif;
  --kai: "LXGW WenKai TC", "Noto Serif TC", "PingFang TC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120F;
    --paper: #241E18;
    --paper-edge: #3a3026;
    --ink: #EADFC6;
    --ink-soft: #b3a68c;
    --vermilion: #D8604F;
    --azure: #6FA3C4;
    --green: #86B894;
    --gold: #D4A95A;
    --wood: #8a6a45;
    --line: #5a4d3b;
  }
}
:root[data-theme="dark"] {
  --bg: #15120F;
  --paper: #241E18;
  --paper-edge: #3a3026;
  --ink: #EADFC6;
  --ink-soft: #b3a68c;
  --vermilion: #D8604F;
  --azure: #6FA3C4;
  --green: #86B894;
  --gold: #D4A95A;
  --wood: #8a6a45;
  --line: #5a4d3b;
}
* { box-sizing: border-box; }
html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--kai); min-height: 100vh; padding: 16px 0 28px; }
.wrap { max-width: 420px; margin: 0 auto; padding: 0 16px; }

.kicker { font-size: 13px; color: var(--ink-soft); text-align: center; margin: 4px 0 10px; letter-spacing: .1em; }

/* scroll: rollers + paper */
.scroll { position: relative; }
.roller {
  height: 22px; border-radius: 11px;
  background: linear-gradient(to bottom, #8a6a45, var(--wood) 40%, #4f3620);
  box-shadow: 0 3px 6px rgba(0,0,0,.25);
  margin: 0 -10px; position: relative; z-index: 2;
}
.roller.bottom { margin-top: -2px; }
.paper {
  background: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, rgba(120,95,55,.05) 31px 32px);
  margin: -4px 4px;
  padding: 22px 18px 26px;
  border-left: 2px solid var(--paper-edge);
  border-right: 2px solid var(--paper-edge);
  transform-origin: top center;
  animation: unroll 1.1s cubic-bezier(.2,.7,.2,1) both;
  box-shadow: inset 0 0 22px rgba(90,60,20,.12);
}
@keyframes unroll {
  from { clip-path: inset(0 0 100% 0); }
  to   { clip-path: inset(0 0 0 0); }
}
.title {
  font-family: var(--serif); font-size: 22px; font-weight: 700; text-align: center;
  letter-spacing: .3em; margin: 0 0 4px;
}
.sub { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; }
.seal-mark {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 3px;
  background: var(--vermilion); color: var(--paper); font-family: var(--serif); font-size: 14px; margin-right: 6px; vertical-align: middle;
}

/* stat ribbon */
.ribbon {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  margin: 0 -18px 16px; padding: 10px 0; background: rgba(180,138,60,.08);
}
.ribbon > div { text-align: center; font-size: 12px; color: var(--ink-soft); border-left: 1px dashed var(--line); }
.ribbon > div:first-child { border-left: 0; }
.ribbon b { display: block; font-family: var(--serif); font-size: 15px; color: var(--ink); font-weight: 700; margin-top: 2px; }
.ribbon .up { color: var(--green); }
.ribbon .dn { color: var(--vermilion); }
.ribbon .flat { color: var(--gold); }

.chapter { font-size: 13px; color: var(--azure); margin: 0 0 6px; letter-spacing: .08em; }
.from { font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; }
.from b { color: var(--ink); font-weight: 500; }
.narr { font-size: 16px; line-height: 1.9; margin: 0 0 16px; text-align: justify; }

.opts { display: grid; gap: 8px; }
.opt {
  font: inherit; color: var(--ink); text-align: left; background: rgba(255,255,255,.25);
  border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-height: 44px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; cursor: pointer;
}
.opt:active { background: rgba(78,125,91,.12); }
.opt .txt { font-size: 15px; line-height: 1.5; grid-column: 1 / 2; }
.impact { grid-column: 2 / 3; font-size: 12px; color: var(--ink-soft); white-space: nowrap; text-align: right; }
.impact b { font-weight: 500; }
.impact .g { color: var(--green); }
.impact .r { color: var(--vermilion); }
.impact .n { color: var(--gold); }
.opt[aria-pressed="true"] { border-color: var(--green); background: rgba(78,125,91,.12); }

.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; }
.foot .note { font-size: 12px; color: var(--ink-soft); }
.approve {
  font: inherit; font-size: 15px; min-height: 44px; padding: 0 16px; border-radius: 4px;
  background: var(--vermilion); color: var(--paper); border: 0; cursor: pointer;
}
.approve:disabled { opacity: .4; cursor: default; }
.legend { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 16px 0 0; line-height: 1.6; }

@media (prefers-reduced-motion: reduce) {
  .paper { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">年終考評 · 景和元年</p>

  <div class="scroll">
    <div class="roller" aria-hidden="true"></div>
    <article class="paper" id="paper">
      <h1 class="title">史冊・景和元年</h1>
      <p class="sub">陛下即位以來，天下大勢如下</p>

      <div class="ribbon" role="list" aria-label="年度變化（示意）">
        <div role="listitem">國庫<b class="dn">▼ 略減</b></div>
        <div role="listitem">民心<b class="up">▲ 回升</b></div>
        <div role="listitem">軍備<b class="flat">— 持平</b></div>
        <div role="listitem">天命<b class="up">▲ 微升</b></div>
      </div>

      <p class="chapter">第一章 · 春汛</p>
      <p class="from">奏報人：<b>都水司郎中 沈廷之</b></p>
      <p class="narr">臣奉命巡視下游堤防，今春雨水早至，堤下村落已有數處滲漏。工部所請之款已由戶部撥下大半，然料石短缺，役夫多有怨言。臣以為，若陛下肯另撥一批糧餉以安民心，則可趁農閒徵發丁壯加固堤身；若一味節省，恐秋汛一至，前功盡棄。伏請聖裁。</p>

      <div class="opts" role="group" aria-label="三項選擇">
        <button class="opt" data-k="a" aria-pressed="false">
          <span class="txt">A. 另撥糧餉，趁農閒加固堤防</span>
          <span class="impact">國庫 <b class="r">大↓</b> 民心 <b class="g">小↑</b></span>
                  </button>
        <button class="opt" data-k="b" aria-pressed="false">
          <span class="txt">B. 以現有錢糧先修急段，餘待明年</span>
          <span class="impact">國庫 <b class="n">中↓</b> 民心 <b class="r">小↓</b></span>
                  </button>
        <button class="opt" data-k="c" aria-pressed="false">
          <span class="txt">C. 擇地遷村，另築新堤</span>
          <span class="impact">國庫 <b class="r">大↓</b> 民心 <b class="g">中↑</b></span>
                  </button>
      </div>

      <div class="foot">
        <span class="note" id="note">請擇一策</span>
        <button class="approve" id="approve" disabled>御批</button>
      </div>
    </article>
  </div>
  <div class="roller bottom" aria-hidden="true"></div>

  <p class="legend">提案示意：影響以 小／中／大 表示，箭頭為增減方向；綠為有利、朱為不利、金為中性。假資料，非正式數值。</p>
</div>

<script>
(function () {
  var opts = document.querySelectorAll('.opt');
  var approve = document.getElementById('approve');
  var note = document.getElementById('note');
  opts.forEach(function (b) {
    b.addEventListener('click', function () {
      opts.forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      approve.disabled = false;
      note.textContent = '已擇第 ' + b.dataset.k.toUpperCase() + ' 策';
    });
  });
  approve.addEventListener('click', function () {
    note.textContent = '御批已下（示意，未結算）';
    approve.disabled = true;
  });
})();
</script>
</body>
</html>
