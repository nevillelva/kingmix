   字型：標題與朱批用 LXGW WenKai TC（霹鹜文楷 TC 比例版，內嵌子集字型），正文用 Noto Serif TC。季節以頁底淡色區分；無障礙偏好減少動態時，轉場與飄雪皆停用。 */
:root{
  --silk:#EFE6D2; --paper:#F8F1E0; --ink:#1F1A17; --ink-soft:#5a4f45; --line:#B9A77F;
  --vermilion:#B03A2E; --azure:#2E5E7E; --green:#4E7D5B; --gold:#B48A3C;
  --zone:#E4D9BF; --zone-hi:#D5C49C; --shadow:rgba(60,40,20,.18);
  --seal-fg:#EFE6D2;
  --t-spring:rgba(78,125,91,.16); --t-summer:rgba(46,94,126,.13); --t-autumn:rgba(180,138,60,.18); --t-winter:rgba(255,255,255,.75);
  --serif:"LXGW WenKai TC","Noto Serif TC","PingFang TC",serif;
  --kai:"Noto Serif TC","LXGW WenKai TC","PingFang TC",serif;
  color-scheme:light;
}

    --t-spring:rgba(134,184,148,.12); --t-summer:rgba(111,163,196,.12); --t-autumn:rgba(212,169,90,.12); --t-winter:rgba(200,215,230,.09);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --silk:#1A1512; --paper:#26201B; --ink:#EDE3CC; --ink-soft:#bfb29a; --line:#5d5140;
  --vermilion:#D8604F; --azure:#6FA3C4; --green:#86B894; --gold:#D4A95A;
  --zone:#2b251f; --zone-hi:#3d342a; --shadow:rgba(0,0,0,.5); --seal-fg:#1A1512;
  --t-spring:rgba(134,184,148,.12); --t-summer:rgba(111,163,196,.12); --t-autumn:rgba(212,169,90,.12); --t-winter:rgba(200,215,230,.09);
  color-scheme:dark;
}
/* 季節頁底色：由 html[data-season] 決定，無季節時為透明 */
:root{--tint:transparent}
:root[data-season="spring"]{--tint:var(--t-spring)}
:root[data-season="summer"]{--tint:var(--t-summer)}
:root[data-season="autumn"]{--tint:var(--t-autumn)}
:root[data-season="winter"]{--tint:var(--t-winter)}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--silk); color:var(--ink); font:15px/1.7 var(--kai);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 104px; min-height:100vh;
  background-image:radial-gradient(circle at 50% -10%, var(--paper), transparent 60%), radial-gradient(ellipse at 50% 115%, var(--tint), transparent 70%);
}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:2}
/* 頂欄：年號、世次，以及四項國勢（僅示意高低，確切數值見帝王頁） */
.top{position:sticky;top:0;z-index:5;background:var(--silk);margin:0 -16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px}
.seal{flex:none;width:40px;height:40px;border-radius:4px;background:var(--ink);color:var(--seal-fg);display:grid;place-items:center;font:900 20px/1 var(--serif);box-shadow:inset 0 0 0 2px var(--gold)}
.top h1{font:900 18px/1.2 var(--serif);margin:0;letter-spacing:.08em}
.top .when{font-size:13px;color:var(--ink-soft);margin-top:2px}
.snd{all:unset;box-sizing:border-box;cursor:pointer;margin-left:auto;align-self:center;font-size:12px;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.snd[aria-pressed="true"]{color:var(--azure);border-color:var(--azure)}
.snd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.gauges:empty{display:none}
.gauge{min-width:0;font-size:12px;color:var(--ink-soft)}
.gauge .bar{height:4px;background:var(--line);border-radius:2px;margin:3px 0 2px;overflow:hidden}
.gauge .bar i{display:block;height:100%;background:var(--azure);border-radius:2px}
.gauge.lo .bar i{background:var(--ink-soft)}
.gauge.hi .bar i{background:var(--green)}
.gauge b{font-weight:500;color:var(--ink)}
/* 卷面：一般卡片 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px;margin:14px 0;position:relative}
.card::after{content:"";position:absolute;inset:4px;border:1px dashed var(--line);border-radius:2px;pointer-events:none;opacity:.5}
.card h2{font:700 16px/1.3 var(--serif);margin:0 0 10px;color:var(--ink);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:16px;background:var(--gold);border-radius:1px;flex:none}
.kicker{font-size:12px;letter-spacing:.2em;color:var(--azure);margin-bottom:4px}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 10px}
.muted{color:var(--ink-soft)}
/* 數值橫條 */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.meter .row1{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft)}
.meter .row1 b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--azure);border-radius:3px;transition:width .5s ease}
.fill.warn{background:var(--ink-soft)} .fill.gold{background:var(--green)}
/* 摺本：奏摺卡片（直書標題、摺線） */
.memorial{position:relative;display:grid;grid-template-columns:52px 1fr;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px var(--shadow);padding:18px 16px 18px 14px;margin:14px 0}
.memorial::before{content:"";position:absolute;top:12px;bottom:12px;left:66px;width:1px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 10px);pointer-events:none}
.memorial::after{content:"";position:absolute;top:6px;left:6px;right:6px;border-top:1px dashed var(--line);opacity:.6;pointer-events:none}
.vtitle{writing-mode:vertical-rl;font:700 17px/1.3 var(--serif);letter-spacing:.3em;color:var(--ink);border-right:2px solid var(--gold);padding-right:8px;min-height:200px;align-self:stretch}
.mbody{min-width:0}
.memorial h3{font:900 22px/1.3 var(--serif);margin:0 0 4px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--silk);transition:border-color .15s,background .15s}
.opt:hover,.opt:focus-visible{border-color:var(--azure)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt:active{background:color-mix(in srgb,var(--green) 12%,var(--silk))}
.opt:disabled{opacity:.45;cursor:default}
.opt .mark{flex:none;width:28px;height:28px;border:1.5px solid var(--azure);color:var(--azure);border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--serif)}
/* 朱批：僅用於帝王裁決（奏摺與東廠處置、開局、禪位、親征） */
.opt.zhu .mark{border-color:var(--vermilion);color:var(--vermilion)}
.opt .otxt{min-width:0;display:flex;flex-direction:column;gap:2px}
.opt .label{font-weight:500}
.narr{margin:6px 0 10px;line-height:1.75;color:var(--ink-soft)}
.opt .hint{font-size:12px;color:var(--ink-soft)}
.eff{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chip.up{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.chip.down{background:transparent;border:1px solid var(--ink-soft);color:var(--ink-soft)}
/* 按鈕：一般操作用藍，朱批用朱 */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;text-align:center;padding:12px;background:var(--azure);color:var(--seal-fg);border-radius:4px;font-weight:700;letter-spacing:.1em;width:100%;margin-top:12px}
.btn.zhu{background:var(--vermilion)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.mini{width:auto;display:inline-block;padding:6px 12px;margin-top:0;font-size:13px;letter-spacing:.05em}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn+.btn{margin-top:10px}
/* 朝臣：人物卡 */
.officials{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.person .head{display:flex;gap:10px;align-items:center}
.portrait{flex:none;width:44px;height:52px;border-radius:4px;overflow:hidden;background:var(--silk);border:1px solid var(--line);display:block;padding:0}
.portrait svg{display:block;width:100%;height:100%}
.person .name{font:700 15px/1.2 var(--serif);min-width:0;overflow-wrap:anywhere}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink-soft)}
.tag.bond{color:var(--vermilion);border-color:var(--vermilion)}
.abil{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;text-align:center;font-size:11px;color:var(--ink-soft)}
.abil b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.loy{font-size:12px;color:var(--ink-soft)}
.fbline{color:var(--green);font-size:14px;margin:0 0 10px}
.fbline:empty{display:none}
/* 勢力 */
.factions{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:6px 0 10px;border:1px solid var(--line)}
.factions div{transition:width .5s}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bar-row{display:grid;grid-template-columns:4.5em 1fr 2.5em;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar-row b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
/* 東廠 */
.case{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.case:last-child{border-bottom:0}
.lvl{display:inline-flex;gap:3px}
.lvl span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.lvl span.on{background:var(--azure)}
.empty{color:var(--ink-soft);font-size:14px;margin:4px 0}
/* 後宮與子嗣 */
.list{list-style:none;padding:0;margin:0}
.list li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.list li>span:first-child{min-width:0}
.list li:last-child{border-bottom:0}
/* 宮城平面圖（導覽入口） */
.plan{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px}
.plan svg{display:block;width:100%;height:auto}
.plan .wall{fill:none;stroke:var(--ink-soft);stroke-width:2}
.plan .gate{fill:none;stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3}
.plan g.zone{cursor:pointer;outline:none}
.plan rect.tile{fill:var(--zone);stroke:var(--line);stroke-width:1.2;transition:fill .15s}
.plan rect.hall{fill:var(--zone-hi);stroke:var(--azure);stroke-width:1.6}
.plan g.zone:hover rect,.plan g.zone:focus-visible rect{fill:var(--zone-hi)}
.plan g.zone:focus-visible rect{stroke:var(--gold);stroke-width:2}
.plan text{font-family:var(--serif);fill:var(--ink);font-size:13px;pointer-events:none}
.plan text.hallname{font-size:17px;font-weight:700}
.plan text.sm{font-size:11px;fill:var(--ink-soft)}
.plan text.compass{font-size:11px;fill:var(--ink-soft)}
/* 史冊卷軸：年終考評、結局諡號 */
.review{margin:14px 0}
.roller{height:20px;border-radius:10px;background:linear-gradient(to bottom,#8a6a45,#6B4A2B 40%,#4f3620);box-shadow:0 3px 6px rgba(0,0,0,.25);margin:0 -10px;position:relative;z-index:2}
.roller.bottom{margin-top:-2px}
.scroll-paper{background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(120,95,55,.06) 31px 32px);margin:-4px 4px;padding:22px 18px 22px;border-left:2px solid var(--line);border-right:2px solid var(--line);animation:unroll 1.1s cubic-bezier(.2,.7,.2,1) both;box-shadow:inset 0 0 22px rgba(90,60,20,.12)}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.stitle{font:700 22px/1.3 var(--serif);text-align:center;letter-spacing:.3em;margin:0 0 4px}
.ssub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.ribbon{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -18px 16px;padding:10px 0;background:color-mix(in srgb,var(--gold) 10%,transparent)}
.ribbon>div{text-align:center;font-size:12px;color:var(--ink-soft);border-left:1px dashed var(--line);min-width:0}
.ribbon>div:first-child{border-left:0}
.ribbon b{display:block;font:700 15px/1.4 var(--serif);color:var(--ink)}
.ribbon small{display:block;font-size:11px}
.ribbon .up{color:var(--green)} .ribbon .dn{color:var(--ink-soft)} .ribbon .flat{color:var(--gold)}
.chapter{font-size:13px;color:var(--azure);margin:12px 0 6px;letter-spacing:.08em}
.narr{font-size:16px;line-height:1.9;margin:0 0 16px;text-align:justify}
.posth{display:flex;gap:12px;align-items:center;margin:4px 0 14px}
.posth b{font:700 20px/1.3 var(--serif)}
.sealmini{flex:none;width:52px;height:52px;border-radius:6px;background:var(--vermilion);color:var(--seal-fg);display:grid;place-items:center;font:900 28px/1 var(--serif);box-shadow:inset 0 0 0 2px var(--paper),0 0 0 1px var(--vermilion)}
/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--silk);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6}
nav.tabs .in{display:flex;width:100%;max-width:560px;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs button{all:unset;flex:1;min-width:0;text-align:center;padding:8px 0 10px;font-size:12px;color:var(--ink-soft);cursor:pointer;position:relative;letter-spacing:.04em}
nav.tabs button.active{color:var(--azure);font-weight:700}
nav.tabs button.active::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--azure)}
nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
/* 開局 */
.hero{text-align:center;padding:28px 0 8px}
.hero .seal-big{width:76px;height:76px;margin:0 auto 14px;border-radius:8px;background:var(--ink);color:var(--seal-fg);display:grid;place-items:center;font:900 40px/1 var(--serif);box-shadow:0 0 0 4px var(--silk),0 0 0 5px var(--gold)}
.hero h2{font:900 26px/1.25 var(--serif);margin:0 0 8px;letter-spacing:.1em}
.hero p{color:var(--ink-soft);margin:0 auto;max-width:34ch}
label.lbl{display:block;font-size:13px;color:var(--ink-soft);margin:12px 0 6px}
input.seed,select.seed{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--silk);color:var(--ink)}
input.seed:focus-visible,select.seed:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
/* 季節：飄雪（僅冬季；減少動態時靜止） */
.snow{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.snow[hidden]{display:none}
.snow i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
@keyframes fall{from{transform:translate3d(0,0,0)}to{transform:translate3d(18px,110vh,0)}}
/* 墨暈轉場：畫面切換時短暫淡出 */
#ink{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:9}
#ink.go{animation:inkfade 1s ease-out both}
#ink{background:radial-gradient(ellipse 45% 38% at 50% 45%, color-mix(in srgb,var(--ink) 35%,transparent), transparent 72%)}
@keyframes inkfade{0%{opacity:0;transform:scale(.45)}25%{opacity:.6}100%{opacity:0;transform:scale(1.5)}}
@media (max-width:360px){
  .meters,.officials{grid-template-columns:1fr}
  .vtitle{font-size:15px;min-height:180px}
  .memorial{grid-template-columns:44px 1fr}
  .memorial::before{left:58px}
  .gauges{gap:6px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
/* ── 時段、奏摺滑動、新年年號覆蓋層（gap-ui-slots） ── */
.opt.sel{border-color:var(--vermilion);box-shadow:inset 0 0 0 1px var(--vermilion)}
.opts.swipe{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.swipe-bar .swipe-hint{flex:1 1 90px;font-size:12px;color:var(--ink-soft);text-align:center}
.slot-kicker{font-size:13px;color:var(--ink-soft);letter-spacing:.1em;margin:0 0 6px}
.slot-note{font-size:13px;margin:8px 0 0;color:var(--ink-soft)}
.nianhao{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(31,26,23,.72);padding:16px;cursor:pointer}
.nh-card{background:var(--paper);border:2px solid var(--gold);border-radius:6px;padding:28px 20px;text-align:center;max-width:320px;width:100%;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.nh-kicker{font-size:14px;color:var(--ink-soft);letter-spacing:.15em}
.nh-title{font:900 56px/1.25 var(--serif);color:var(--vermilion);margin:10px 0;overflow-wrap:anywhere}
.nh-sub{font-size:15px;color:var(--ink-soft);margin-bottom:16px}
.nh-close{margin-top:0}
@media (prefers-reduced-motion: no-preference){
  .nianhao{animation:nhIn .4s ease-out both}
  @keyframes nhIn{from{opacity:0}to{opacity:1}}
}
/* ── 朱批印章、任免官職、禪位對話框、邸報、返回宮城（Phase 6／8 補強） ── */
.opt{position:relative}
.opt.stamping{pointer-events:none}
.zhu-stamp{position:absolute;right:12px;top:50%;width:46px;height:46px;margin-top:-23px;border:3px solid var(--vermilion);color:var(--vermilion);border-radius:4px;display:grid;place-items:center;font:900 24px/1 var(--serif);background:color-mix(in srgb,var(--vermilion) 8%,transparent);transform:scale(2.4) rotate(-14deg);opacity:0;animation:stampIn .45s cubic-bezier(.3,1.5,.6,1) forwards;pointer-events:none}
@keyframes stampIn{0%{opacity:0}60%{opacity:.95}100%{transform:scale(1) rotate(-6deg);opacity:.92}}
.offrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.offrow:last-of-type{border-bottom:0}
.offbtns{display:flex;gap:8px;flex-wrap:wrap}
.offbtns .btn{margin-top:0}
.offpick{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.safety.warn{color:var(--vermilion)}
.safety.ok{color:var(--green)}
.age{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:6px}
.dlg-ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(31,26,23,.6);padding:16px}
.dlg{background:var(--paper);border:2px solid var(--gold);border-radius:6px;padding:22px 18px;max-width:340px;width:100%;box-sizing:border-box}
.dlg h2{font:900 20px/1.3 var(--serif);margin:0 0 8px}
.dlg p{margin:0 0 16px;color:var(--ink-soft);font-size:14px}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg-btns .btn{margin-top:0}
.navback{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:12px 0;font-weight:700;color:var(--azure);letter-spacing:.06em}
.navback:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
.gazette .ribbon small{display:block;font-size:11px}
</style>

// ── 音效：古琴背景音、決定時敲磬、新年鐘聲。以 Web Audio 合成，不使用外部音檔。
// 瀏覽器須待使用者互動後才能發聲：第一次點擊或按鍵後才建立音訊、開始琴音；可隨時靜音（預設開，可於本機關閉）。
let soundOn = true;
try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch(e) {}
let audioCtx = null, masterGain = null, audioUnlocked = false, bgmTimer = null, bgmStep = 0;
function audioReady(){
  if (audioCtx) return audioCtx;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9; masterGain.connect(audioCtx.destination);
  } catch(e) { audioCtx = null; }
  return audioCtx;
}
// 單一音：基音頻率乘以泛音比例，指數衰減。
function partial(freq, when, dur, vol, type, ratio){
  const ac = audioCtx; if (!ac || !masterGain) return;
  try {
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq * (ratio || 1);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur + 0.05);
  } catch(e) {}
}
// 古琴：撥弦音（三角波，短促起音、較長餘韻）
const qin = (freq, when, vol) => { partial(freq, when, 2.4, vol || 0.04, 'triangle'); partial(freq, when, 1.2, (vol || 0.04) * 0.25, 'sine', 2); };
// 磬：清越的單擊，帶非整數泛音
const qing = when => { partial(660, when, 3.4, 0.09, 'sine'); partial(660, when, 2.2, 0.03, 'sine', 2.76); partial(660, when, 1.4, 0.015, 'sine', 5.4); };
// 鐘：低沉長鳴，泛音錯落
const zhong = when => { partial(196, when, 5.5, 0.14, 'sine'); partial(196, when, 4.2, 0.06, 'sine', 2.0); partial(196, when, 3.0, 0.05, 'sine', 2.4); partial(196, when, 2.2, 0.035, 'sine', 3.0); };
// 琴曲：D 宮五聲音階，旋律循環，偶爾低音
const PENTA = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25];
const PHRASE = [0,2,4,2,5,4,2,0, 3,1,4,6,4,2,1,0, 0,2,3,5,4,2,0,null];
function bgmTick(){
  if (!soundOn || !audioCtx) return;
  const idx = PHRASE[bgmStep % PHRASE.length]; bgmStep++;
  if (idx !== null) qin(PENTA[idx], 0, 0.035);
  if (bgmStep % 8 === 1) qin(PENTA[0] / 2, 0, 0.03);
}
function startBgm(){ if (!bgmTimer && soundOn) bgmTimer = setInterval(bgmTick, 900); }
function stopBgm(){ if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }
function unlockAudio(){
  const ac = audioReady();
  if (!ac) return;
  audioUnlocked = true;
  if (ac.state === 'suspended') ac.resume().catch(() => {});
  startBgm();
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
const SFX = {
  pick: () => qing(0),
  win: () => { qing(0); qing(0.22); },
  lose: () => { qin(196, 0, 0.06); qin(165, 0.18, 0.05); },
  end: () => zhong(0),
  bell: () => zhong(0),
};
function sfx(name){ if (!soundOn || !audioUnlocked || !audioCtx) return; const f = SFX[name]; if (f) f(); }

function newGame(s, scenId, eraRaw, pols){
  seed = s || String(Math.floor(Math.random()*1e9));
  const list = pols && pols.length ? pols : ['agrarian'];
  const opts = { policy: list[0], era: eraRaw };
  try {
    state = scenId ? createScenarioState(seed, scenId, opts) : createInitialState(seed, opts);
  } catch (e) {
    state = createInitialState(seed, opts);
    feedback = '本紀劇本載入失敗，已改為一般開局。';
  }
  setAccessionPolicies(state, list);
  reviewedCount = 0;
  save(); tab = 'palace'; panel = null; pick1 = null; render();
}
function pendingCase(){ return (state.dongchang?.cases || []).find(c => c.status === 'leverage'); }
function campaignActive(){ return !!(state.campaign && state.campaign.status === 'active'); }
// 連鎖事件與 sim.js 相同：每月開始時取出一則（takeChain），同月重繪沿用同一結果，故記在 state.monthChain。
function chainEvent(id){
  const e = id ? events.find(x => x.id === id) : null;
  if (!e || !isAvailable(e)) return null;
  if ((state.eventHistory?.counts?.[id] || 0) >= EVENT_MAX_PER_RUN) return null;
  return e.options.some((o) => isAvailable(o) && optionOpen(state, o)) ? e : null;
}
// 早朝兩則奏摺：第 1 則必出（連鎖優先），第 2 則 50%（與 sim.js 同一 rng 路徑）。
// 每月開始時一次決定並存於 state.monthChain，同月重繪、行動後不改變。
function morningPair(){
  const key = `${state.year}-${state.month}`;
  if (!state.monthChain || state.monthChain.key !== key) state.monthChain = { key, id: takeChain(state) };
  const mc = state.monthChain;
  if (!state.alive || pendingCase()) return { first: null, second: null, secondDone: false };
  if (!('second' in mc)) {
    const chained = chainEvent(mc.id);
    const first = chained ?? pickEvent(state, events, rng('events', state.year, state.month));
    mc.first = first ? first.id : null;
    const second = pickSecondMemorial(state, events, rng(state.year, state.month, 'morning2'), mc.first);
    mc.second = second ? second.id : null;
    mc.secondDone = false;
  }
  const byId = id => (id ? events.find(x => x.id === id) : null) || null;
  return { first: byId(mc.first), second: byId(mc.second), secondDone: !!mc.secondDone };
}
function finishMonth(keepFeedback){
  if (!keepFeedback) feedback = '';
  const endingYear = state.month === 12 ? state.year : null;
  try { monthlyDrift(state, state.year, state.month); } catch(e) {} // 鄰國好感月度漂移（外交）
  monthlyTick(state, rng('tick', state.year, state.month));
  advanceMonth(state);
  if (state.scenario) { try { evaluateScenario(state); } catch(e) {} }
  if (endingYear !== null && state.alive) {
    state.annals = state.annals || [];
    state.annals.push({
      year: endingYear, generation: state.dynasty.generation,
      treasury: Math.round(state.stats.treasury), people: Math.round(state.stats.people),
      military: Math.round(state.stats.military), agriculture: Math.round(state.stats.agriculture),
      wars: state.wars.length, wins: state.wars.filter(w => w.won).length,
      officials: state.officials.length, consorts: (state.consorts||[]).length,
      dc: state.dongchang.cases.filter(c => c.status !== 'closed').length
    });
  }
  autoAppoint(state);
  if (!state.alive) tryAccession(state);
  save(); render();
}
function chooseDC(action){ applyDongchangAction(state, pendingCase().id, action); sfx('pick'); finishMonth(); }
function chooseOption(opt, ev){
  const before = { ...state.stats };
  recordEvent(state, ev.id);
  applyOption(state, opt, rng('recruit', state.year, state.month));
  // 連鎖排程與君臣共歷（shared_event）皆由引擎 afterOption 處理，頁面不另行記錄。
  afterOption(state, ev, opt);
  const parts = Object.keys(STAT).map(k => {
    const d = Math.round(state.stats[k] - before[k]);
    return d ? `${STAT[k].l}${d > 0 ? '+' : ''}${d}` : null;
  }).filter(Boolean);
  feedback = `所選：${opt.label}。${parts.length ? '數值變化：' + parts.join('、') : '數值無明顯變化。'}`;
  sfx('pick');
  finishMonth(true);
}

// ── 親征（三回合戰役）：由事件的征戰選項進入，或由外交宣戰進入 ──
const applyFx = (st, eff) => {
  for (const [k, v] of Object.entries(eff || {})) if (k in st.stats) setStat(st, k, st.stats[k] + v);
};
// 事件的征戰選項：先套用其餘效果，再開戰；戰事結束後才推進本月（tick）。
function startEventCampaign(opt, ev){
  const { war, ...rest } = opt.effects || {};
  if (!war) return render();
  recordEvent(state, ev.id);
  applyOption(state, { ...opt, effects: rest }, rng('recruit', state.year, state.month));
  afterOption(state, ev, opt);
  const r = startCampaign(state, war);
  if (!r.ok) { feedback = '此役無法出征。'; save(); return render(); }
  state.campaign.tick = true;
  state.campaign.title = ev.name;
  feedback = `${ev.name}：出兵親征。`;
  sfx('pick');
  save(); render();
}
function finishCampaignUI(f, prefix){
  const c = f.campaign;
  const word = f.outcome === 'peace' ? '和議既成，兵戈暫息'
    : f.outcome === 'talks_failed' ? (f.won ? '和議不成，然戰績居先' : '和議不成，退兵')
    : (f.won ? '大捷' : '戰敗');
  feedback = `${prefix}${word}。`;
  sfx(f.won ? 'win' : 'lose');
  if (c.tick) return finishMonth(true);
  save(); render();
}
function campAct(a, v){
  const c = state.campaign;
  if (!c || c.status !== 'active') return render();
  if (a === 'camp-recon') {
    const r = reconnoiter(state);
    feedback = r.ok ? `遣探偵察，敵軍約 ${r.estimate}。` : '此時無法偵察。';
    save(); return render();
  }
  if (a === 'camp-tactic') {
    const label = TACTICS[v] ? TACTICS[v].label : v;
    const r = pickTactic(state, v, applyFx);
    if (!r.ok) { feedback = '此戰術不可用。'; return render(); }
    if (!r.finished) {
      feedback = `第${r.round.round}回合${label}，${r.round.won ? '得勝' : '失利'}。`;
      save(); return render();
    }
    return finishCampaignUI(r.finished, `第${r.round.round}回合${label}，`);
  }
  if (a === 'camp-peace') {
    const r = offerPeace(state, applyFx);
    if (!r.ok) { feedback = '此時無法議和。'; return render(); }
    return finishCampaignUI(r.finished, '');
  }
}

      <span class="hint">耗粮 ${t.grain}${c.grain < t.grain ? '（粮草不足，戰力減損）' : ''}${t.gambleChance ? '　（有賭運，成敗難料）' : ''}</span></span></button>`).join('');
  const canRecon = c.round === 0 && !scouted;
  return `${fbLine()}<section class="card"><h2>軍務・${esc(c.title || '親征')}</h2>

    ${log ? `<ul class="list" style="margin-bottom:8px">${log}</ul>` : ''}

    ${c.round >= 1 ? `<button class="btn ghost" data-act="camp-peace">遣使議和</button>` : ''}

const hsh = s => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
// 立繪：程序化 SVG。官帽依官職、印章色依品級、臉型與鬚由 (姓名) 決定。
function portrait(o){

    '<rect x="13" y="14" width="22" height="25" rx="8"/>',
    '<ellipse cx="24" cy="26" rx="9.5" ry="15"/>',
  ][h % 3];
  const cap = rank === 'top'
    ? '<path d="M17 15 L19 3 L29 3 L31 15 Z"/><rect x="13" y="14" width="22" height="3" rx="1.2"/>'
    : rank === 'office'

      : '<path d="M14 14 Q24 5 34 14 L34 16 L14 16 Z"/>';
  const beard = (h >>> 3) % 2 ? '<path d="M19 34 Q24 44 29 34 Q24 38 19 34 Z"/>' : '';
  return `<svg viewBox="0 0 48 56" width="44" height="52" aria-hidden="true">
    <path d="M5 56 Q5 41 24 39 Q43 41 43 56 Z" style="fill:${robe}"/>
    <g fill="#E3C49B">${face}</g>
    <g style="fill:#2a2420">${cap}${beard}<circle cx="19.5" cy="25" r="1.3"/><circle cx="28.5" cy="25" r="1.3"/></g>
    <circle cx="40" cy="12" r="5" style="fill:${badge};stroke:var(--paper);stroke-width:1.5"/>

// 選項只顯示方向與大小（小／中／大），不列精確數字；數值仍以 events.json 為準。

function chooseSecond(opt, ev){
  const before = { ...state.stats };
  recordEvent(state, ev.id);
  applyOption(state, opt, rng(state.year, state.month, 'morning2', 'recruit'));
  afterOption(state, ev, opt);
  state.monthChain.secondDone = true;
  const parts = Object.keys(STAT).map(k => {
    const d = Math.round(state.stats[k] - before[k]);
    return d ? `${STAT[k].l}${d > 0 ? '+' : ''}${d}` : null;
  }).filter(Boolean);
  feedback = `次奏所選：${opt.label}。${parts.length ? '數值變化：' + parts.join('、') : '數值無明顯變化。'}`;
  sfx('pick');
  save(); render();
}

    const cls = d > 0 ? 'up' : d < 0 ? 'dn' : 'flat';

    return `<div><span>${label}</span><b>${val}</b><small class="${cls}">${txt}</small></div>`;
  };
  app.innerHTML = `
    <section class="review" aria-label="年終考評">

      <div class="roller" aria-hidden="true"></div>

function pressureLine(){
  const p = state.factionPressure || {};
  const parts = [];
  const fc = forcingFaction(state.factions);
  if (fc) {
    const pol = POLICIES[FACTION_POLICY[fc]];
    parts.push(`${FAC(fc).l}勢過 ${FACTION_FORCE_THRESHOLD}，已持續 ${p.forcedMonths || 0} / ${FORCE_MONTHS} 月${pol ? `，將逼迫國策改為「${pol.name}」` : ''}。`);
  }
  if (strongFactionCount(state.factions) === 3) parts.push('三派並立：官員忠誠每月流失。');
  if (factionsBalanced(state.factions)) parts.push(`三派均衡：行政效率 ${BALANCED_EFFICIENCY}，稅制增減打折。`);
  const last = (p.forcedPolicies || []).slice(-1)[0];
  if (last) parts.push(`近例：${FAC(last.faction).l}逼迫，國策由「${POLICIES[last.from]?.name || '—'}」改為「${POLICIES[last.to]?.name || '—'}」。`);
  return parts.length ? `<div class="sub" style="margin:10px 0 0">${parts.map(esc).join('<br>')}</div>` : '';
}

// 禪位確認：頁內對話框（不使用 confirm()），取消或按 Esc 即關閉；確認後結束本世，由太子或成年皇子即位。
function openResignDialog(){
  const heir = state.dynasty.crownPrince ? state.heirs.find(h => h.id === state.dynasty.crownPrince) : null;
  const who = heir ? `太子${esc(heir.personName || heir.name)}` : '成年皇子中擇定之人';
  const ov = document.createElement('div');
  ov.className = 'dlg-ov';
  ov.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">
      <h2 id="dlg-t">禪位予皇子</h2>
      <p id="dlg-d">禪位即結束本世，由${who}即位。此舉不可復原，史冊將記下此次禪位。</p>
      <div class="dlg-btns"><button type="button" class="btn ghost mini" data-dlg="cancel">取消</button>
        <button type="button" class="btn zhu mini" data-dlg="ok">確認禪位</button></div>
    </div>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  ov.addEventListener('click', e => {
    if (e.target === ov) return close();
    const b = e.target.closest('[data-dlg]');
    if (!b) return;
    if (b.dataset.dlg === 'cancel') return close();
    close();
    confirmResign();
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
  ov.querySelector('[data-dlg="cancel"]').focus();
}
function confirmResign(){
  if (!state || !state.alive) return;
  state.campaign = null;
  state.alive = false; state.endReason = '禪位';
  feedback = '';
  finishMonth();
}

  } else if (panel === 'city') {

// 皇子個性（立儲面板顯示用）；舊存檔無個性者顯示「—」。

// 冊立東宮：E125 選項 A 設定 crown_choice_pending 後，於朝堂顯示此卡。不耗行動，無取消鈕，未選定前不自動指定。
function crownChoiceCard(){

function onAgency(e){
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || !state) return;
  const a = b.dataset.act, v = b.dataset.arg;
  if (a.startsWith('camp-')) return campAct(a, v);
  if (a === 'close') { panel = null; pick1 = null; return render(); }
  if (a === 'open') {
    if (v === 'appoint') { tab = 'officials'; panel = null; pick1 = null; return render(); } // 任免官員至校場（朝臣頁）
    panel = v; pick1 = null; return render();
  }
  if (a === 'exam') {
    const r = holdExam(state, rng('exam', state.year, state.month));
    if (!r.ok) {
      feedback = r.reason === 'cooldown' ? `開科每 ${EXAM_INTERVAL_TURNS} 月一次，尚餘 ${r.remaining} 月。` : '朝中官員已滿，無法開科。';
      save(); return render();
    }
    const names = r.added.map(id => { const o = state.officials.find(x => x.id === id); return o ? (o.personName || o.name) : id; }).join('、');
    return useAction(`開科取士，新進士${names}入朝，可任官。`);
  }
  if (a === 'office') { pick1 = v; panel = 'appoint2'; return render(); }
  if (a === 'dismiss') {
    const prev = dismissOffice(state, v);
    if (!prev) { feedback = `${OFFICE[v]}本無人任職。`; return render(); }
    return useAction(`免去${prev.personName || prev.name}之${OFFICE[v]}，官職暫缺。`);
  }
  if (a === 'suggest') {
    const c = suggestCandidate(state, v);
    if (!c) { feedback = '朝中無閒置之臣可薦。'; return render(); }
    const gaps = assignOffice(state, c.id, v);
    return useAction(`依吏部建議，任命${c.personName || c.name}為${OFFICE[v]}${gaps.length ? '（未達標，效果打折）' : ''}。`);
  }
  if (a === 'assign') {
    const off = state.officials.find(o => o.id === v);
    const gaps = assignOffice(state, v, pick1);
    const label = OFFICE[pick1] || pick1;
    return useAction(`任命${off ? (off.personName || off.name) : ''}為${label}${gaps.length ? '（能力未達標，效果打折）' : ''}。`);
  }
  if (a === 'dcopen') {
    const off = state.officials.find(o => o.id === v);
    const c = openInvestigation(state, v);
    if (!c) return useAction(activeCaseCount(state) >= MAX_ACTIVE_CASES ? `東廠同時最多 ${MAX_ACTIVE_CASES} 案。` : '此官已有案件。');
    return useAction(`東廠開案調查${off ? (off.personName || off.name) : ''}。`);
  }
  if (a === 'policy') {
    const r = changePolicy(state, v);
    if (!r.ok) {
      const why = r.reason === 'locked' ? `換策後一年內不可再換，尚餘 ${r.remaining} 月。` : r.reason === 'prestige' ? '威儀不足，無法換策。' : '無法換策。';
      feedback = why; panel = null; pick1 = null; save(); return render();
    }
    return useAction(`國策改為${POLICIES[v].name}，耗威儀 ${POLICY_CHANGE_PRESTIGE_COST} 點。`);
  }
  if (a === 'eraset' || a === 'eraconfirm') {
    const raw = a === 'eraset' ? v : (document.getElementById('era-new')?.value ?? '');
    const r = changeEra(state, raw);
    if (!r.ok) {
      feedback = r.reason === 'cooldown' ? `改元每 ${ERA_CHANGE_COOLDOWN_MONTHS} 個月一次，尚餘 ${r.remaining} 月。`
        : r.reason === 'prestige' ? `威儀不足，改元需 ${ERA_CHANGE_PRESTIGE_COST} 點。` : ERA_REASON_TEXT[r.reason];
      if (r.reason === 'cooldown' || r.reason === 'prestige') panel = null;
      pick1 = null; save(); return render();
    }
    markNewYearShown();
    openNianhao(eraYearText(state), '改元詔下，萬象更新。');
    return useAction(`改元為「${r.name}」，耗威儀 ${ERA_CHANGE_PRESTIGE_COST} 點。`);
  }
  if (a === 'crownpick') {
    const h = state.heirs.find(x => x.id === v);
    const r = chooseCrownPrince(state, v);
    if (!r.ok) { feedback = '所選皇子不合資格。'; save(); return render(); }
    feedback = `冊立${h ? (h.personName || h.name) : '皇子'}為太子。`;
    save(); return render();
  }
  if (a === 'heir') {
    const h = state.heirs.find(x => x.id === v);
    const nm = h ? (h.personName || h.name) : '某皇子';
    const r = chooseCrownPrince(state, v);
    if (!r.ok) {
      const why = r.reason === 'same' ? '此人已是太子。' : r.reason === 'prestige' ? '威儀不足，無法改立。' : '所選皇子不合資格。';
      feedback = why; panel = null; pick1 = null; save(); return render();
    }
    return useAction(r.changed ? `改立${nm}為太子，耗威儀 ${CHANGE_CROWN_PRINCE_PRESTIGE_COST} 點。` : `立${nm}為太子。`);
  }
  // 派系施壓（拉攏／打壓）：每月限一派，以 agency().faction 記錄。
  if (a === 'faction' || a === 'suppress') {
    if (agency().faction) { feedback = '本月已對一派施壓，下月再議。'; panel = null; pick1 = null; save(); return render(); }
    if (a === 'faction') { rallyFaction(state, v); agency().faction = true; return useAction(`拉攏${FACTION[v].l}，其餘兩派下降。`); }
    suppressFaction(state, v); agency().faction = true;
    return useAction(`打壓${FACTION[v].l}，其餘兩派上升。`);
  }
  if (a === 'tax') {
    setTaxTier(state, v);
    return useAction(`稅制改為${v}稅。`);
  }
  if (a === 'repair') {
    const nm = cityOf(state, v)?.name || '';
    const r = repairCity(state, v);
    if (!r.ok) { feedback = `此舉未成：${REASON[r.reason] || '條件未符'}。`; return render(); }
    return useAction(`工匠修繕${nm}城池，城防提升。`);
  }
  if (a === 'dneigh') { pick1 = v; panel = 'diplo2'; return render(); }
  if (a === 'dpath') {
    const n = neighborById(pick1);
    if (!n) return render();
    let r, msg;
    if (v === 'marry') { r = arrangeMarriage(state, n.id); msg = `與${n.name}聯姻，兩國停戰二年。`; }
    else if (v === 'tribute') { r = acceptTribute(state, n.id); msg = `${n.name}遣使朝貢，國庫增益。`; }
    else if (v === 'ally') { r = formAlliance(state, n.id); msg = `與${n.name}結盟。`; }
    else { r = startCampaign(state, { strength: n.strength, reward: { ...DECLARE_WAR_REWARD }, loss: { ...DECLARE_WAR_LOSS } }, { neighborId: n.id }); msg = `宣戰${n.name}，親征出兵。`; if (r.ok) { state.campaign.title = `征討${n.name}`; } }
    if (!r.ok) { feedback = `此舉未成：${REASON[r.reason] || '條件未符'}。`; return render(); }
    if (v === 'war') { sfx('pick'); }
    return useAction(msg);
  }
  if (a === 'remon') {
    if (actionsLeft() <= 0) return;
    const off = state.officials.find(o => o.id === v);
    const r = remonstrate(state, v, rng('remon', state.year, state.month, v));
    if (!r) return render();
    const nm = off ? (off.personName || off.name) : '某臣';
    return useAction(r.died ? `${nm}進諫忤旨，被貶除名。` : `${nm}進諫，陛下納諫，君臣更見相得。`);
  }
}

function wireMemorialSwipe(n){
  const card = app.querySelector('.memorial');
  const box = card && card.querySelector('.opts');
  const body = card && card.querySelector('.mbody');
  if (!box || !body || n < 1) return;
  let sel = 0, sx = null, sy = null, swiped = false;
  const items = () => [...box.querySelectorAll('.opt[data-i]')];
  const paint = () => items().forEach((el, i) => {
    el.classList.toggle('sel', i === sel);
    el.setAttribute('aria-current', i === sel ? 'true' : 'false');
  });
  const go = d => { sel = (sel + d + n) % n; paint(); };
  box.classList.add('swipe');
  box.addEventListener('pointerdown', e => { if (e.button > 0) return; sx = e.clientX; sy = e.clientY; swiped = false; });
  box.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy) * 1.5) { swiped = true; go(dx < 0 ? 1 : -1); }
  });
  box.addEventListener('pointercancel', () => { sx = null; });
  // 滑動結束後的那次 click 不應誤觸裁決
  box.addEventListener('click', e => { if (swiped) { swiped = false; e.preventDefault(); e.stopPropagation(); } }, true);
  const bar = document.createElement('div');
  bar.className = 'swipe-bar';
  bar.innerHTML = `<button type="button" class="btn ghost mini" data-sw="-1" aria-label="上一項">◀ 上一項</button>
    <span class="swipe-hint">左右滑動選擇，或點擊直接裁決</span>
    <button type="button" class="btn ghost mini" data-sw="1" aria-label="下一項">下一項 ▶</button>
    <button type="button" class="btn zhu mini" data-sw="commit">裁決所選</button>`;
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-sw]');
    if (!b) return;
    if (b.dataset.sw === 'commit') { const it = items()[sel]; if (it) it.click(); return; }
    go(+b.dataset.sw);
  });
  body.appendChild(bar);
  paint();
}

// ── 新年年號覆蓋層：每逢一月第一次進入時顯示，點擊或 Esc 關閉；每局每年一次。改元時亦即時顯示 ──
const shownNewYear = new Set();
function newYearKey(){ return `kingmix.newyear.${seed}.${state.year}`; }
function markNewYearShown(){
  const key = newYearKey();
  shownNewYear.add(key);
  try { localStorage.setItem(key, '1'); } catch (e) {}
}
function openNianhao(title, sub){
  const ov = document.createElement('div');
  ov.className = 'nianhao';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', '年號');
  ov.innerHTML = `<div class="nh-card">
      <div class="nh-kicker">第${state.dynasty.generation}世 · ${state.year}年</div>
      <div class="nh-title">${esc(title)}</div>
      <div class="nh-sub">${esc(sub)}</div>
      <button type="button" class="btn zhu nh-close">點擊繼續</button></div>`;
  const onKey = e => { if (e.key === 'Escape') close(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  ov.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
  sfx('bell');
  ov.querySelector('.nh-close').focus();
}
function showNewYear(){
  if (!state || !state.alive || state.month !== 1) return;
  const key = newYearKey();
  if (shownNewYear.has(key)) return;
  shownNewYear.add(key);
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
  openNianhao(eraYearText(state), '新歲伊始，萬象更新。');
}

const VIEWS = { palace: renderPalace, court: renderCourt, officials: renderOfficials, harem: renderHarem, dc: renderDC, throne: renderThrone };
function render(){
  topGauges();
  applySeason();
  if (!state) {
    document.getElementById('when').textContent = '未開局';
    renderStart(); document.getElementById('nav').style.display='none';
    return inkFlash('start');
  }
  calendar();
  if (!state.alive) { renderEnding(); document.getElementById('nav').style.display='none'; return inkFlash('end'); }
  renderNav();
  if (reviewPending()) { renderReview(); return inkFlash('review'); }
  VIEWS[tab]();
  showNewYear();
  inkFlash(tab);
}

try { events = (await (await fetch('data/events.json')).json()).events; } catch (e) { events = []; }
